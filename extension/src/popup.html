<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CATCH</title>
    <style>
      body {
        margin: 0;
        width: 280px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #081c15;
        color: #d8f3dc;
        padding: 14px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #95d5b2;
        margin-top: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #2d6a4f;
        background: #1b4332;
        color: #d8f3dc;
      }
      button {
        margin-top: 12px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px;
        background: #2d6a4f;
        color: #d8f3dc;
        font-weight: 600;
        cursor: pointer;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <h1>CATCH</h1>
    <p style="margin: 0; font-size: 12px; color: #95d5b2">
      Configure the cloud API used by Try-On Everywhere.
    </p>
    <label>
      API base URL
      <input id="apiUrl" placeholder="http://127.0.0.1:8000/api/v1" />
    </label>
    <label>
      API key
      <input id="apiKey" type="password" placeholder="dev-api-key" />
    </label>
    <button id="save">Save</button>
    <script src="popup.js"></script>
  </body>
</html>
